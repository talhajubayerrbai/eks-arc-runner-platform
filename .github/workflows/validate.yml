# ──────────────────────────────────────────────────────────────────────────────
# Validation Pipeline
# Runs ENTIRELY on self-hosted Kubernetes runners (ARC).
# Triggered automatically after the Build and Deploy workflow completes,
# or manually via workflow_dispatch.
# ──────────────────────────────────────────────────────────────────────────────
name: Validate Deployment

on:
  workflow_run:
    workflows:
      - "Build and Deploy"
    types:
      - completed
  workflow_dispatch:
    inputs:
      app_url:
        description: "Application URL to validate (e.g. http://alb-hostname)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: "Validate Deployment"
    runs-on: self-hosted
    # Only run validation when the build succeeded (or when manually triggered)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Update kubeconfig"
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name eks-arc-runner-platform

      # Resolve APP_URL from input or from Ingress
      - name: "Resolve application URL"
        id: resolve-url
        run: |
          if [ -n "${{ inputs.app_url }}" ]; then
            APP_URL="${{ inputs.app_url }}"
          else
            # Wait up to 5 minutes for ALB hostname
            for i in $(seq 1 30); do
              ALB_HOSTNAME=$(kubectl get ingress spring-boot-app -n default \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
              if [ -n "$ALB_HOSTNAME" ]; then
                APP_URL="http://${ALB_HOSTNAME}"
                break
              fi
              echo "Waiting for ALB hostname... (${i}/30)"
              sleep 10
            done
          fi
          if [ -z "$APP_URL" ]; then
            echo "ERROR: Could not resolve application URL"
            exit 1
          fi
          echo "APP_URL=${APP_URL}" >> $GITHUB_ENV
          echo "app_url=${APP_URL}" >> $GITHUB_OUTPUT
          echo "Application URL: ${APP_URL}"

      # Stage 1: Smoke Test
      - name: "1 — Smoke Test"
        run: |
          echo "Running smoke test against: ${{ env.APP_URL }}"
          # Wait for the app to be reachable (up to 3 minutes)
          for i in $(seq 1 18); do
            if curl -sf --max-time 10 "${{ env.APP_URL }}/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              break
            fi
            echo "Attempt ${i}/18 — app not ready yet, retrying in 10s..."
            sleep 10
            if [ $i -eq 18 ]; then
              echo "ERROR: App did not become healthy within 3 minutes"
              exit 1
            fi
          done
          curl -f "${{ env.APP_URL }}/health"

      # Stage 2: REST Assured integration tests
      - name: "Set up Java 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: "2 — REST Assured Integration Tests"
        working-directory: app
        env:
          APP_URL: ${{ env.APP_URL }}
        run: |
          ./gradlew integrationTest --no-daemon \
            -Dapp.url=${{ env.APP_URL }}

      # Stage 3: k6 Load Test
      - name: "Install k6"
        run: |
          # Install k6 if not already present on runner
          if ! command -v k6 &> /dev/null; then
            curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
            echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' \
              | sudo tee /etc/apt/sources.list.d/k6.list
            sudo apt-get update -qq
            sudo apt-get install -y k6
          fi
          k6 version

      - name: "3 — k6 Load Test"
        env:
          K6_APP_URL: ${{ env.APP_URL }}
        run: |
          k6 run \
            --env APP_URL=${{ env.APP_URL }} \
            --out json=tests/k6/results.json \
            tests/k6/load-test.js

      # Stage 4: Deployment Verification
      - name: "4 — Deployment Verification"
        run: |
          echo "=== Pods ==="
          kubectl get pods -n default -l app.kubernetes.io/name=spring-boot-app

          echo "=== Ingress ==="
          kubectl get ingress -n default

          echo "=== Assert all pods Running ==="
          NOT_RUNNING=$(kubectl get pods -n default \
            -l app.kubernetes.io/name=spring-boot-app \
            --field-selector=status.phase!=Running \
            -o name 2>/dev/null)
          if [ -n "$NOT_RUNNING" ]; then
            echo "ERROR: Some pods are not in Running state:"
            echo "$NOT_RUNNING"
            exit 1
          fi
          echo "All pods are Running ✓"

      # Stage 5: Generate HTML Report
      - name: "Upload k6 results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_id }}
          path: tests/k6/results.json
          retention-days: 14

      - name: "Set up Python for report generation"
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "5 — Generate HTML Report"
        if: always()
        run: |
          python tests/report/generate_report.py \
            --surefire-dir app/build/test-results/test \
            --jacoco-xml app/build/reports/jacoco/test/jacocoTestReport.xml \
            --k6-json tests/k6/results.json \
            --output report.html

      - name: "Upload HTML report artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.run_id }}
          path: report.html
          retention-days: 30
